server:
  port: 8080

spring:
  application:
    name: second-hand-campus-api
  datasource:
    url: jdbc:mysql://localhost:3306/second_hand_campus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  demo-token-prefix: demo-token-
  demo-token-secret: local-demo-secret-change-me
